services:
  api:
    build: .
    ports:
      - "${MUSIC_STREAM_BIND_IP:-127.0.0.1}:${MUSIC_STREAM_PORT:-8080}:8080"
      - "127.0.0.1:${MUSIC_STREAM_OAUTH_PORT:-8087}:8080"
    environment:
      NAVIDROME_URL: ${NAVIDROME_URL:-}
      NAVIDROME_USERNAME: ${NAVIDROME_USERNAME:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      MUSIC_STREAM_OAUTH_PORT: ${MUSIC_STREAM_OAUTH_PORT:-8087}
      MUSIC_STREAM_API_TOKEN: ${MUSIC_STREAM_API_TOKEN:-}
      MUSIC_STREAM_CORS_ORIGINS: ${MUSIC_STREAM_CORS_ORIGINS:-}
    volumes:
      - music-stream-data:/data

volumes:
  music-stream-data:
